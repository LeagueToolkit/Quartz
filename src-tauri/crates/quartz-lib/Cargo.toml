[package]
name = "quartz-lib"
version = "0.1.0"
edition = "2021"
# src/bin/ is the bin-FORMAT module, not cargo binaries — without this,
# `cargo test -p quartz-lib` tries to compile src/bin/*.rs as standalone bins.
autobins = false

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async + HTTP
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Streaming the hash-DB download for byte progress (reqwest's `stream` feature
# yields a futures Stream of `bytes::Bytes`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

# Concurrency / fast maps
rayon = "1.10"
parking_lot = "0.12"
rustc-hash = "2"
dashmap = "6.0"

# Filesystem walking + path regex for the Flint-ported repath engine
walkdir = "2.4"
regex = "1"

# LMDB via heed — memory-mapped hash lookups (matches Flint)
heed = "0.20"

# Compression for the prebuilt LMDB release assets
zstd = "0.12"

# Binary parsing for BNK/WPK/WEM audio
byteorder = "1.5"

# Decoding user-supplied audio (mp3/flac/ogg/wav/m4a) down to PCM samples, which
# is where rs_audio takes over. Reading user audio files is explicitly out of
# scope for that crate, so it is the app's side of the boundary.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4"] }

# Data
indexmap = { version = "2.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Texture decode for WAD preview (DDS/TEX → RGBA → PNG). Matches rs_tex's image rev.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Logging (macros only)
tracing = "0.1"

# RitoShark crates — BIN/format handling, TEX decode, audio (bnk/wpk/wem).
ritoshark = { git = "https://github.com/RitoShark/RitoShark-Crates", rev = "24fe6b3", features = ["tex", "anim", "mesh", "audio"] }

[dev-dependencies]
# Scratch dirs for the live-install extraction tests (auto-removed on drop).
tempfile = "3"
