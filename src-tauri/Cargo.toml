[workspace]
members = [".", "crates/quartz-lib"]

[package]
name = "quartz"
version = "4.2.7"
edition = "2021"
default-run = "quartz"

[lib]
name = "quartz"
path = "src/lib.rs"

[[bin]]
name = "quartz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quartz-lib = { path = "crates/quartz-lib" }
tauri = { version = "2.11", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# `.modpkg` unpack/pack for the Explorer menu. Pinned to the same version
# Celestial vendors, so a package one tool writes is one the other reads.
ltk_modpkg = "0.8.0"
# LeagueToolkit's own magic-byte file-kind table, so a chunk unpacked from a modpkg
# gets the same extension their tools would give it rather than a second opinion.
ltk_file = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Rebinding the std handles onto a freshly allocated console (see
    # `ensure_console`) opens CONIN$/CONOUT$ and calls SetStdHandle.
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
] }

# Release settings match Flint's, deliberately.
#
# Both ship unsigned NSIS installers, so the only thing standing between a
# release and a Defender "Trojan:Win32/Wacatac.C!ml" is how familiar the binary
# looks to an ML classifier. 4.1.5 tripped that (2/69 on VirusTotal, both hits
# generic-ML) after this profile moved to thin LTO and a `.cargo/config.toml`
# swapped the linker to rust-lld. Neither changed BEHAVIOUR, but together they
# changed the produced PE's shape: section layout, padding and codegen all
# differ from an MSVC-linked, fat-LTO build, which is exactly what those models
# key on. Flint builds clean with the settings below, so Quartz uses them too.
#
# The cost is real: fat LTO with one codegen unit is single-threaded for most of
# the link and takes several minutes longer. That is the trade being made on
# purpose. Do not "optimize" this back to thin LTO or reintroduce a linker
# override without re-scanning the installer afterwards.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Texture preview is CPU-heavy even in the development app. Keep the app
# crate debuggable while optimizing the decoder/resize/PNG dependencies.
[profile.dev.package.ritoshark]
opt-level = 3

[profile.dev.package.rs_tex]
opt-level = 3

[profile.dev.package.texpresso]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
