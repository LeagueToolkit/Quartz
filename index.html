<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quartz</title>
    <style>
      /* Native loading screen — shows immediately before React mounts;
         main.tsx removes #loading-screen once the app is ready.
         Sequence: soft accent aurora breathes → logo pops in → "Quartz" types
         out letter-by-letter → the trailing dot blinks like a terminal cursor.
         Uses the app's real cyan-blue accent. */
      .native-loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        background: #0d0d0f;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      .native-loading-aura {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 340px;
        height: 200px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          ellipse at center,
          rgba(63, 166, 244, 0.22),
          rgba(15, 144, 241, 0.06) 45%,
          transparent 70%
        );
        filter: blur(14px);
        animation: quartz-aura-breathe 4s ease-in-out infinite;
      }

      .native-loading-content {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        position: relative;
        z-index: 3;
        /* Anchor the row so the logo stays put while the word types out to the
           right, instead of the whole group re-centering as text grows. */
        width: max-content;
      }

      .native-loading-logo {
        height: 72px;
        width: auto;
        display: block;
        transform-origin: center;
        /* pop-in once; no pulsing glow on the logo itself (the background
           aura carries the glow instead) */
        animation: quartz-logo-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .native-loading-title {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #ededf0;
        display: flex;
        align-items: baseline;
      }

      /* Typewriter: the word keeps its natural width (so the dot never moves),
         and a clip-path wipe reveals the letters left-to-right. Starts after the
         logo pops. */
      .native-loading-word {
        display: inline-block;
        white-space: nowrap;
        animation: quartz-type 0.55s cubic-bezier(0.65, 0, 0.35, 1) 0.55s both;
      }

      /* Trailing cursor dot — hidden until typing finishes, then blinks. */
      .native-loading-title .dot {
        color: #3fa6f4;
        opacity: 0;
        animation: quartz-cursor-blink 1s steps(1) 1.1s infinite;
      }

      @keyframes quartz-type {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes quartz-cursor-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @keyframes quartz-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.3) rotate(-8deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes quartz-aura-breathe {
        0%,
        100% {
          opacity: 0.4;
          transform: translate(-50%, -50%) scale(0.92);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.06);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .native-loading-aura,
        .native-loading-logo,
        .native-loading-word,
        .native-loading-title .dot {
          animation: none;
        }
        .native-loading-aura {
          opacity: 0.7;
        }
        .native-loading-word {
          clip-path: none;
        }
        .native-loading-title .dot {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Native loading screen - shows immediately before React loads -->
      <div id="loading-screen" class="native-loading-screen">
        <div class="native-loading-aura"></div>
        <div class="native-loading-content">
          <img src="/your-logo.gif" alt="Quartz Logo" class="native-loading-logo" />
          <div class="native-loading-title"><span class="native-loading-word">Quartz</span><span class="dot">.</span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
